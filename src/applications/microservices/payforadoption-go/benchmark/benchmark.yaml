---
concurrency: 4
base: 'http://localhost:80'
iterations: 4
rampup: 2

plan:
    - name: Health check
      request:
          url: /health/status
          method: GET

    - name: Adopt Bunnies
      request:
          url: /adoptions
          method: POST
          headers:
              Content-Type: application/json
          body: '{"pet_id": "{{ item }}", "pet_type": "bunny", "user_id": "user007"}'
      with_items:
          - '023'
          - '024'
          - '025'
          - '026'
          - 'invalid_bunny_id'

    - name: Adopt Kittens
      request:
          url: /adoptions
          method: POST
          headers:
              Content-Type: application/json
          body: '{"pet_id": "{{ item }}", "pet_type": "kitten", "user_id": "user007"}'
      with_items:
          - '016'
          - '017'
          - '018'
          - '019'
          - '020'
          - '021'
          - '022'
          - 'invalid_kitten_id'

    - name: Adopt Puppies
      request:
          url: /adoptions
          method: POST
          headers:
              Content-Type: application/json
          body: '{"pet_id": "{{ item }}", "pet_type": "puppy", "user_id": "user007"}'
      with_items:
          - '001'
          - '002'
          - '003'
          - '004'
          - '005'
          - '006'
          - '007'
          - '008'
          - '009'
          - '010'
          - '011'
          - '012'
          - '013'
          - '014'
          - '015'
          - 'invalid_puppy_id'

    - name: Cleanup Adoptions
      request:
          url: /adoptions?user_id=user007
          method: DELETE
